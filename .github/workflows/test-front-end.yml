name: Test Front End

on:
  push:
    branches:
      - main
    paths:
      - "front-end/**"
      - ".github/workflows/test-front-end.yml"
  pull_request:
    paths:
      - "front-end/**"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: front-end 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run